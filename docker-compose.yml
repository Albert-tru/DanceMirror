version: '3.8'

services:
  # DanceMirror 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dancemirror-app
    ports: # ✅ 新增：把应用的端口暴露给你的电脑
      - "8080:8080"
    environment:
      # 从 .env 文件读取或在此覆盖
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=MySQL666
      - DB_NAME=dancemirror
      - JWT_SECRET=your-secret-key-change-in-production
      - JWT_EXPIRATION=3600
      - UPLOAD_DIR=/app/uploads
      - REDIS_HOST=redis  # <--- 新增这一行
      - REDIS_PORT=6379   # <--- 新增这一行
      - STORAGE_DRIVER=minio
      - MINIO_ENDPOINT=minio:9000  # 注意：在 Docker 内部要用服务名 "minio"
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=dancemirror
      - MINIO_USE_SSL=false      
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/  # <--- 新增这一行
    volumes:
      # 挂载 uploads 目录到宿主机（持久化上传文件）
      - ./uploads:/app/uploads
      # 挂载静态文件（开发时可热更新前端）
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:          # <--- 1. 新增依赖 Redis 服务
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: # <--- 2. 新增这一整个部分
      - dancemirror-network

  # MySQL 数据库服务
  db:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: dancemirror-db
    environment:
      MYSQL_ROOT_PASSWORD: MySQL666
      MYSQL_DATABASE: dancemirror
    ports:
      - "3306:3306"
    volumes:
      # 持久化数据库数据
      - db-data:/var/lib/mysql
      # 如果有初始化 SQL，可以挂载
      # - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMySQL666"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dancemirror-network

  # ⭐ 新增：Redis 服务
  redis:
    image: redis:7-alpine
    container_name: dancemirror-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dancemirror-network

  #新增minio
  minio:
    image: minio/minio
    container_name: dancemirror-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - dancemirror-network 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dancemirror-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
    networks:
      - dancemirror-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: dancemirror-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # 设置 JVM 堆内存大小
      - xpack.security.enabled=false # 禁用安全功能以简化设置
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - dancemirror-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      
networks:
  dancemirror-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  es-data:
    driver: local
